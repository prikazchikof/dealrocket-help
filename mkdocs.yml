site_name: Справка DealRocket
site_description: Инструкции по поиску B2B-клиентов, работе с контактами, списками, экспортом и обогащением данных в DealRocket
site_url: https://help.dealrocket.ru/
copyright: © DealRocket

theme:
  name: material
  language: ru
  custom_dir: overrides
  logo: assets/images/dealrocket-logo-white.svg
  favicon: assets/images/favicon.ico
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    scheme: dealrocket
    primary: custom
    accent: custom
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight

plugins:
  - search:
      lang:
        - ru
        - en

hooks:
  - scripts/footer_links.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: false
      title: На этой странице
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/site.js

extra:
  generator: false
  homepage: https://dealrocket.ru/
  consent:
    title: Файлы cookie
    description: >-
      Мы используем файлы "cookie", в соответствии с
      <a href="https://dealrocket.ru/app/privacy.pdf" target="_blank" rel="noopener">политикой</a>.
      В интернете без них никак.
    actions:
      - accept
  links:
    app: https://dealrocket.ru/app/
    pricing: https://dealrocket.ru/app/pricing/
    contacts: https://dealrocket.ru/app/contacts

nav:
  - Навигация по справке: index.md
  - Начало работы:
      - Зачем использовать DealRocket: start/why-dealrocket/index.md
      - Подготовиться к поиску: start/preparation/index.md
      - Качество данных: start/data-quality/index.md
  - Поиск клиентов:
      - Собрать новую базу: search/new-database/index.md
      - Найти по своему списку: search/company-list/index.md
      - Найти в крупном бизнесе: search/large-business/index.md
      - Убрать нерелевантные компании: search/refine/index.md
      - AI-помощник и подборки: search/ai-assistant/index.md
      - Как работают фильтры: search/filters/index.md
  - Работа с результатами:
      - Контакты сотрудников и компаний: results/contacts/index.md
      - Списки: results/lists/index.md
      - Экспорт в Excel: results/export/index.md
      - Что делать с базой: results/work-with-data/index.md
  - Тарифы и оплата:
      - Тарификация: billing/tarification/index.md
      - Оплата и документы: billing/payment-documents/index.md
  - Дополнительно:
      - Другие вопросы: additional/questions/index.md
      - Как найти идеальных B2B-клиентов: https://dealrocket.ru/how_to/
      - Блог о продажах: https://dealrocket.ru/news/
